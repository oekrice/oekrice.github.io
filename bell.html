
<!DOCTYPE html>
<meta charset="utf-8">
<title>Bell Simulation</title>

<style>
body{
    margin:0;
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100%;
    overflow: hidden;
}

canvas{
    background:#ADD8E6;
    border:1px solid black;
    display: block;
    width: min(100vw, 100vh);
    height: min(100vw, 100vh); 
}
</style>

</head>

<body>

<canvas id="canvas" width="384" height="384"></canvas>

<script type="module">

//------------------------------------------------------------
// Make a simple loading screen. It's mainly numpy that's taking a while it seems
//------------------------------------------------------------

//------------------------------------------------------------
// Stop it scrolling om mobile devices
//------------------------------------------------------------

document.body.addEventListener("touchmove", (e) => {
    e.preventDefault();
}, { passive: false });

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.style.touchAction = "none";

function resize() {
    const size = Math.min(window.innerWidth, window.innerHeight)
    canvas.width = size;
    canvas.height = size;
}


window.addEventListener("resize", resize);
resize();

ctx.fillStyle="lightblue";
ctx.fillRect(0,0,canvas.height,canvas.width);
ctx.fillStyle = "black";
ctx.font = "24px sans-serif";
ctx.textAlign = "center";
ctx.fillText("Loading things...", canvas.width / 2, canvas.height / 2);


import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.mjs";

const pyodide = await loadPyodide();


await pyodide.loadPackage(["numpy"]);

//------------------------------------------------------------
// Load your python files
//------------------------------------------------------------

const scripts = ["python/nets.py", "python/bell_physics.py", "python/main.py"];

for (const script of scripts) {
    const code = await (await fetch(script)).text();
    const filename = script.split("/").pop();  
    pyodide.FS.writeFile(filename, code);
}


await pyodide.runPythonAsync(`
import main
`);

//------------------------------------------------------------
// Load in images
//------------------------------------------------------------

const wheel_img = new Image();
wheel_img.src = "./bell_img/wheel.png";
const clapper_img = new Image();
clapper_img.src = "./bell_img/clapper.png";
const bell_img = new Image();
bell_img.src = "./bell_img/justbell.png";



//------------------------------------------------------------
// Import python objects
//------------------------------------------------------------

const main = pyodide.pyimport("main");
// const Sim = main.get("Sim");
// const sim = new Sim();

const render_state = main.render_state;

// Import session state variables (which remain for eternity)
let sim = main.sim;
let bell_state = main.bell_data;
let inputs = main.inputs;

// Import the main step function (which updates the session state variables)
const step = main.step;
//------------------------------------------------------------
// Canvas
//------------------------------------------------------------

let scaleFact = canvas.width / 384;
// Put in min/max limits for this factor 
scaleFact = Math.max(0.75, Math.min(scaleFact, 1.5));

//------------------------------------------------------------
// Sound
//------------------------------------------------------------

const ding = new Audio("./bell_data/ding.ogg");



//------------------------------------------------------------
// All inputs (keyboard, mouse, touch)
//------------------------------------------------------------

window.addEventListener("keydown",(e)=>{
    if(e.code==="Space"){
        inputs.set("pull", 1.0);
    }
    if(e.code==="KeyU"){
        inputs.set("current_mode", "up_hand");
    }
    if(e.code==="KeyY"){
        inputs.set("current_mode", "up_back");
    }
    if(e.code==="KeyD"){
        inputs.set("current_mode", "down");
    }
    if(e.code==="KeyM"){
        inputs.set("current_mode", "manual");
    }
});

window.addEventListener("keyup",(e)=>{

    if(e.code==="Space")
        inputs.set("pull", 0.0);

});

canvas.addEventListener("pointerdown",(e)=>{
    const y = e.offsetY;
    const imgHeight = scaleFact * wheel_img.height;
    const imageTop = canvas.height / 2 - imgHeight / 2;
    // Set to just be on the bell bit
    if (
        y >= canvas.height / 2 - imgHeight / 2 && y <= canvas.height / 2 + imgHeight / 2)
        {inputs.set("pull", true);
        }
    else
        {inputs.set("pull", false);}
    
});

canvas.addEventListener("pointerup",()=>{
    inputs.set("pull", false);
});

canvas.addEventListener("pointerdown",(e)=>{
    // Check for stay break reset
    if (bell_state.get("stay_break") > 0){
        //Run routine to reset the bell to its original state. I think just send a command to inputs
        inputs.set("reset", true);
    }
});

//------------------------------------------------------------
// Timing
//------------------------------------------------------------

let previous = performance.now();

//------------------------------------------------------------
// Interactive buttons
//------------------------------------------------------------
                   
const buttons = [
    { x: - 90, y: 40, w: 180, h: 32, label: "Ring Up (Hand)", value: false },
    { x: - 270, y: 40 , w: 180, h: 32, label: "Ring Up (Back)", value: false },
    { x: + 90, y: 40 , w: 180, h: 32, label: "Ring Down", value: false },
];

const massButtons = [
    { x: - 90, y: 40, w: 180, h: 32, label: "+", value: false },
    { x: - 270, y: 40 , w: 180, h: 32, label: "-", value: false },
];

function drawButton(button) {

    let buttonWidth = 0.3*canvas.width
    // Update button position and size based on canvas size
    if (button.label == "Ring Up (Back)"){
        button.x = - 1.03*buttonWidth/2; button.y = -0.675*scaleFact*wheel_img.height; button.w = buttonWidth; button.h = 32*scaleFact;
    } else if (button.label == "Ring Up (Hand)"){
        button.x =  - 1.03*3*buttonWidth/2; button.y = -0.675*scaleFact*wheel_img.height; button.w = buttonWidth; button.h = 32*scaleFact;
    } else if (button.label == "Ring Down"){ 
        button.x = 1.03*buttonWidth/2; button.y = -0.675*scaleFact*wheel_img.height; button.w = buttonWidth; button.h = 32*scaleFact;
    } else if (button.label == "+"){
        button.x =  0.25*scaleFact*wheel_img.height; button.y = 0.66*scaleFact*wheel_img.height; button.w = 18*scaleFact; button.h = 18*scaleFact;
    } else if (button.label == "-"){ 
        button.x = -0.25*scaleFact*wheel_img.height - 18*scaleFact; button.y = 0.66*scaleFact*wheel_img.height; button.w = 18*scaleFact; button.h = 18*scaleFact;
    }

    // Rounded rectangle
    ctx.beginPath();
    ctx.roundRect(button.x, button.y, button.w, button.h, 5);

    ctx.fillStyle = button.value ? "#3ca55c" : "#666";
    ctx.fill();

    ctx.strokeStyle = "black";
    ctx.stroke();

    ctx.fillStyle = "white";
    ctx.font =  `${14 * scaleFact}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        `${button.label}`,
        button.x + button.w / 2,
        button.y + button.h / 2
    );
}

function drawCurrentMode() {

    ctx.fillStyle = "black";
    ctx.font =  `${16 * scaleFact}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let modeTitle;
    if (inputs.get("current_mode") == "up_hand") {
        modeTitle = "Ringing Up at Handstroke";
    } else if (inputs.get("current_mode") == "up_back") {
        modeTitle = "Ringing Up at Backstroke";
    } else if (inputs.get("current_mode") == "down") {
        modeTitle = "Ringing Down";
    } else {
        modeTitle = "Press to Pull";

    }

    ctx.fillText(
        `${modeTitle}`,
        0, 1.1*scaleFact*wheel_img.height/2
    );
}

function drawCurrentForce(currentForce) {

    ctx.fillStyle = "black";
    ctx.font =  `${16 * scaleFact}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let forceTitle;
    let forcePc = Math.round(100 * Math.abs(currentForce) / 600.0);

    forceTitle = `Force on Wheel: ${String(forcePc).padStart(3, " ")}%`;
    ctx.fillText(
        `${forceTitle}`,
        0, 1.25*scaleFact*wheel_img.height/2
    );
}

function drawStroke() {

    ctx.fillStyle = "black";
    ctx.font =  `${16 * scaleFact}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let stateTitle = ""
    if (bell_state.get("angle") > Math.PI*0.5){
        stateTitle = "Handstroke"
    } else if (bell_state.get("angle") < -Math.PI*0.5){
        stateTitle = "Backstroke"
    } 
    ctx.fillText(
        `${stateTitle}`,
        scaleFact*wheel_img.height/2, -0.9*scaleFact*wheel_img.height/2
    );
}

function drawScore() {

    ctx.fillStyle = "black";
    ctx.font =  `${16 * scaleFact}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let stateTitle = ""
    let handScore = bell_state.get("hand_score")
    let backScore = bell_state.get("back_score")

    if (bell_state.get("hand_score") > 0 || bell_state.get("back_score") > 0){
        stateTitle = `Score: ${handScore}H, ${backScore}B `
    }
    ctx.fillText(
        `${stateTitle}`,
        -scaleFact*wheel_img.height/2, -0.9*scaleFact*wheel_img.height/2
    );
}

function drawBellMass() {

    ctx.fillStyle = "black";
    ctx.font =  `${16 * scaleFact}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let massTitle = `Bell Mass: ${String(bell_state.get("bell_mass"))}`;
    ctx.fillText(
        `${massTitle}`,
        0, 1.4*scaleFact*wheel_img.height/2
    );
}

function drawStayBreak() {

    if (bell_state.get("stay_break") > 0){
    //if (true) {
        const lines = [
            "You've broken the stay.",
            "How careless.",
            "Click to Reset."
        ];

        const fontSize = 18 * scaleFact;
        const lineHeight = fontSize * 1.3;

        ctx.font = `${fontSize}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const boxWidth = 2000 * scaleFact;
        const boxHeight = lines.length * lineHeight + 30 * scaleFact;

        const x = 0;
        const y = 0;

        // grey background
        ctx.fillStyle = "rgba(120, 120, 120, 0.9)";
        ctx.fillRect(
            x - boxWidth / 2,
            y - boxHeight / 2,
            boxWidth,
            boxHeight
        );

        // red text
        ctx.fillStyle = "red";

        lines.forEach((line, i) => {
            ctx.fillText(
                line,
                x,
                y + (i - (lines.length - 1) / 2) * lineHeight
            );
        });
    }
    }
    
function drawRope(){
    // Function for drawing the rope and 'box' that it passes through
    // Should be easy enough, but requires a little bit of physics 

    ctx.strokeStyle = "black";
    ctx.lineWidth = 1.0;

    let box_x = -0.465*scaleFact*bell_img.width
    let box_y = 0.925*scaleFact*bell_img.width/2
    let boxWidth = 15*scaleFact
    let ropeWidth = 6.0*scaleFact

    let hole_angle = bell_state.get("angle") - 3*Math.PI/4 

    if (hole_angle <= -Math.PI / 2){
        // Fully handstroke -- draw straight up
        ctx.fillStyle = "rgb(207, 176, 2)";
        ctx.fillRect(box_x - ropeWidth/2, 0.0, ropeWidth, 2000);
        ctx.strokeRect(box_x - ropeWidth/2, 0.0, ropeWidth, 2000);
    } else if (hole_angle  >= 0.0){
        //   Fully backstroke -- draw straight across
        ctx.fillStyle = "rgb(207, 176, 2)";
        ctx.fillRect(box_x - ropeWidth/2, box_y - ropeWidth/2, -box_x + ropeWidth/2, ropeWidth);
        ctx.strokeRect(box_x - ropeWidth/2, box_y - ropeWidth/2, -box_x + ropeWidth/2, ropeWidth);
    } else {
    ctx.save()
    ctx.translate(box_x, box_y);
    let x_prop = 1 - Math.cos(hole_angle + Math.PI/2)
    let y_prop = 1 - Math.sin(hole_angle + Math.PI/2)
    ctx.rotate(-Math.atan(y_prop/x_prop))
    ctx.fillStyle = "rgb(207, 176, 2)";
    ctx.fillRect( 0.0, -ropeWidth/2, -box_x, ropeWidth);
    ctx.strokeRect( 0.0, -ropeWidth/2, -box_x, ropeWidth);
    ctx.restore()
    }

    ctx.fillStyle = "rgb(207, 176, 2)";
    ctx.fillRect(box_x - ropeWidth/2, box_y, ropeWidth, 2000);
    ctx.strokeRect(box_x - ropeWidth/2, box_y, ropeWidth, 2000);

    ctx.fillStyle = "brown";

    ctx.fillRect(box_x - boxWidth/2, box_y - boxWidth/2, boxWidth, boxWidth);
    ctx.strokeRect(box_x - boxWidth/2, box_y - boxWidth/2, boxWidth, boxWidth);

}

canvas.addEventListener("pointerdown", e => {
    const x = e.offsetX;
    const y = e.offsetY;
    let worldX = x - canvas.width/2;
    let worldY = y - canvas.height/2;

    for (const button of buttons) {

        if (
            worldX >= button.x &&
            worldX <= button.x + button.w &&
            worldY >= button.y &&
            worldY <= button.y + button.h
        ) {
            // This is what happens when the button is toggled. Changes the neural network input
            if (button.label == "Ring Up (Hand)" && !button.value){
                inputs.set("current_mode", "up_hand");
                button.value = true;
                for (const otherbutton of buttons) {
                    if (otherbutton !== button) {
                        otherbutton.value = false;
                    }
                }
            } else if (button.label == "Ring Up (Back)" && !button.value){
                inputs.set("current_mode", "up_back");
                button.value = true;
                for (const otherbutton of buttons) {
                    if (otherbutton !== button) {
                        otherbutton.value = false;
                    }
                }
            } else if (button.label == "Ring Down" && !button.value){ 
                inputs.set("current_mode", "down");
                button.value = true;
                for (const otherbutton of buttons) {
                    if (otherbutton !== button) {
                        otherbutton.value = false;
                    }
                }
            } else if (button.value){
                inputs.set("current_mode", "manual");
                button.value = false;}
            }
        }
    for (const button of massButtons) {

        if (
            worldX >= button.x &&
            worldX <= button.x + button.w &&
            worldY >= button.y &&
            worldY <= button.y + button.h
        ) {
            // This is what happens when the button is toggled. Changes the neural network input
            if (button.label == "+"){
                inputs.set("masschange", 1);
                button.value = true
            } else if (button.label == "-"){
                inputs.set("masschange", -1);
                button.value = true
            }
        }
    }
    return;

}
)

canvas.addEventListener("pointerup", e => {
    const x = e.offsetX;
    const y = e.offsetY;
    let worldX = x - canvas.width/2;
    let worldY = y - canvas.height/2;

    for (const button of massButtons) {

        if (
            worldX >= button.x &&
            worldX <= button.x + button.w &&
            worldY >= button.y &&
            worldY <= button.y + button.h
        ) {
            button.value = false
        }
    }
    return;

}
)


//------------------------------------------------------------
// Main loop
//------------------------------------------------------------
let angle = 0;
let FPS = 1/60;
let lastForceUpdate = 0
let currentForce = 0.0;

function loop(now){

    //--------------------------------------------------------
    // Python physics
    //--------------------------------------------------------
    bell_state = step(inputs);

    // if(bounced){
    //     ding.cloneNode().play();
    // }

    //--------------------------------------------------------
    // Get render state
    //--------------------------------------------------------
    scaleFact = canvas.width / 384
    scaleFact = Math.max(0.75, Math.min(scaleFact, 3.0));

    const bell_angle = bell_state.get("angle");
    const clapper_angle = bell_state.get("clapper_angle");

    // const state = render_state(Sim);
    // const x = bell.get("x");
    // const y = bell.get("y");
    const sound = bell_state.get("ding");

    if (sound){
        const new_ding = ding.cloneNode();
        new_ding.volume = bell_state.get("strike_velocity")
        new_ding.play();
    }
    //--------------------------------------------------------
    // Draw
    //--------------------------------------------------------
    ctx.textAlign = "center";

    // sky
    ctx.fillStyle="lightblue";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Context for the bell to be drawn. 
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const x_translation = canvas.width / 2;
    const y_translation = canvas.height/ 2;

    ctx.save();

    ctx.translate(x_translation, y_translation);

    const x = - scaleFact * wheel_img.width / 2;
    const y = - scaleFact * wheel_img.height / 2;

    drawRope()

    ctx.rotate(-bell_angle);

    ctx.drawImage(wheel_img, -scaleFact * wheel_img.width / 2, -scaleFact * wheel_img.height / 2, scaleFact * wheel_img.width, scaleFact * wheel_img.height);

    ctx.rotate(-clapper_angle + bell_angle);

    ctx.drawImage(clapper_img, -scaleFact *clapper_img.width / 2, -scaleFact * clapper_img.height / 2, scaleFact * clapper_img.width, scaleFact * clapper_img.height);

    ctx.rotate(-bell_angle + clapper_angle);

    ctx.drawImage(bell_img, -scaleFact * bell_img.width / 2, -scaleFact * bell_img.height / 2, scaleFact * bell_img.width, scaleFact * bell_img.height);

    ctx.rotate(bell_angle);


    for (const button of buttons) {
        drawButton(button);
    }

    for (const button of massButtons) {
        drawButton(button);
    }


    drawCurrentMode();
    drawStroke();
    drawScore();

    // The current force is updated every 50ms, to avoid too much flickering in the display.
    if (now - lastForceUpdate > 50){
        lastForceUpdate = now;
        currentForce = bell_state.get("wheel_force");
    }
    drawCurrentForce(currentForce);

    drawBellMass();

    drawStayBreak();

    

    ctx.restore();

    //--------------------------------------------------------

    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

</script>

</body>
</html>
