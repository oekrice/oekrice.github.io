<meta charset="utf-8">
<title>Pyodide Physics Demo</title>

<style>
body{
    margin:0;
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100%;
    overflow: hidden;
}

canvas{
    background:#ADD8E6;
    border:1px solid black;
    display: block;
    width: min(100vw, 100vh);
    height: min(100vw, 100vh); 
}
</style>

</head>

<body>

<canvas id="canvas" width="384" height="384"></canvas>

<script type="module">

//------------------------------------------------------------
// Make a simple loading screen. It's mainly numpy that's taking a while it seems
//------------------------------------------------------------

//------------------------------------------------------------
// Stop it scrolling om mobile devices
//------------------------------------------------------------

document.body.addEventListener("touchmove", (e) => {
    e.preventDefault();
}, { passive: false });

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    const size = Math.min(window.innerWidth, window.innerHeight)
    canvas.width = size;
    canvas.height = size;
}

window.addEventListener("resize", resize);
resize();

ctx.fillStyle="lightblue";
ctx.fillRect(0,0,400,400);
ctx.fillStyle = "black";
ctx.font = "24px Calibri";
ctx.textAlign = "center";
ctx.fillText("Loading things. Be patient...", canvas.width / 2, canvas.height / 2);


import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.mjs";

const pyodide = await loadPyodide();


await pyodide.loadPackage(["numpy"]);

//------------------------------------------------------------
// Load your python files
//------------------------------------------------------------

const files = ["python/physics.py", "python/render.py", "python/main.py"];

for (const file of files) {
    const code = await (await fetch(file)).text();
    const filename = file.split("/").pop();  
    pyodide.FS.writeFile(filename, code);
}


await pyodide.runPythonAsync(`
import main
`);


//------------------------------------------------------------
// Import python objects
//------------------------------------------------------------

const main = pyodide.pyimport("main");
// const Sim = main.get("Sim");
// const sim = new Sim();

const render_state = main.render_state;

// Import session state variables (which remain for eternity)
let sim = main.sim;
let bell = main.bell;
let inputs = main.inputs;

// Import the main step function (which updates the session state variables)
const step = main.step;
//------------------------------------------------------------
// Canvas
//------------------------------------------------------------


//------------------------------------------------------------
// Sound
//------------------------------------------------------------

const ding = new Audio("./bell_data/ding.ogg");



//------------------------------------------------------------
// Keyboard
//------------------------------------------------------------

window.addEventListener("keydown",(e)=>{

    if(e.code==="ArrowLeft")
        inputs.set("left", true);

    if(e.code==="ArrowRight")
        inputs.set("right", true);

    if(e.code==="Space")
        inputs.set("up", true);

});

window.addEventListener("keyup",(e)=>{

    if(e.code==="ArrowLeft")
        inputs.set("left", false);

    if(e.code==="ArrowRight")
        inputs.set("right", false);

    if(e.code==="Space")
        inputs.set("up", false);

});

//------------------------------------------------------------
// Mouse
//------------------------------------------------------------

canvas.addEventListener("mousedown",()=>{
    inputs.set("up", true);
});

canvas.addEventListener("mouseup",()=>{
    inputs.set("up", false);
});

canvas.addEventListener("touchstart",()=>{
    inputs.set("up", true);
});

canvas.addEventListener("touchend",()=>{
    inputs.set("up", false);
});
//------------------------------------------------------------
// Timing
//------------------------------------------------------------

let previous = performance.now();

//------------------------------------------------------------
// Main loop
//------------------------------------------------------------

function loop(now){

    const dt = (now-previous)/1000;
    previous = now;

    //--------------------------------------------------------
    // Python physics
    //--------------------------------------------------------

    bell = step(sim, bell, inputs);

    // if(bounced){
    //     ding.cloneNode().play();
    // }

    //--------------------------------------------------------
    // Get render state
    //--------------------------------------------------------

    // const state = render_state(Sim);
    const x = bell.get("x");
    const y = bell.get("y");
    const sound = bell.get("bounce");

    if (sound){
        const new_ding = ding.cloneNode();
        new_ding.volume = bell.get("strike_velocity")
        new_ding.play();
    }
    //--------------------------------------------------------
    // Draw
    //--------------------------------------------------------
    ctx.textAlign = "center";

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // sky
    ctx.fillStyle="lightblue";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // ground
    ctx.fillStyle="green";
    ctx.fillRect(0,0.9*canvas.height,canvas.width,0.1*canvas.height);

    // ball

    const px = 0.5*canvas.width + x * 0.2*canvas.width;
    const py = 0.9*canvas.height - y * 0.2*canvas.height;

    ctx.beginPath();
    ctx.arc(px,py,0.05*canvas.width,0,2*Math.PI);
    ctx.fillStyle="red";
    ctx.fill();

    //--------------------------------------------------------

    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

</script>

</body>
</html>
